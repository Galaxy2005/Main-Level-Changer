name: Build Main Level Changer

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Geode CLI
        uses: geode-sdk/install-geode-cli@main

      - name: Build and Package Mod for iOS
        run: geode package --target iOS
