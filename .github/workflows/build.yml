name: Build Main Level Changer

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Geode CLI
        run: pip install geode-cli

      - name: Build and Package for iOS
        run: geode package --platform iOS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-level-changer-ios
          path: build/*.geode
